# DroidPlay Core's own check: the Android host builds with the NDK, and the Android packing and RomFS image tests pass, on Linux and (but for the RomFS image
# tests) on Windows, where the packing script and the desktop app run too. nxnative's workflows that need its macOS
# runners with Xcode 27 (tests, lint-c) or its labels (issue-areas, pr-areas, triage-report) are switched off in this repository's Actions settings; their files
# stay as nxnative has them, so merges from it do not conflict. Device tests stay manual: say what you ran on a device in the pull request (CONTRIBUTING.md).
name: android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_VERSION: 28.2.13676358   # build_android_from_nsp.py check()'s
  CMAKE_VERSION: 3.22.1
  GAME: 0100000011D90000   # Pokémon Brilliant Diamond: the profile the host is built for (any profile does; the job checks code, not a game)

defaults:
  run:
    shell: bash

jobs:
  host:
    name: Android host build and packing tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Python modules the packing script imports
        run: python -m pip install lz4 capstone fonttools zbic
      - name: NDK and CMake
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdk" --licenses > /dev/null   # yes ends on a broken pipe once the licences are taken, which pipefail would count as a failure
          "$sdk" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
      - name: Build the Android host (the game library, the command-line host, the loader and libadrenotools with its hooks)
        run: |
          CM="$ANDROID_HOME/cmake/$CMAKE_VERSION/bin"
          "$CM/cmake" -G Ninja -S dm/android -B build -DCMAKE_MAKE_PROGRAM="$CM/ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DGAME="$GAME" -DPython3_EXECUTABLE="$(command -v python)"
          "$CM/ninja" -C build dmhost_app dmhost_cli nxloader adrenotools hook_impl main_hook
      - name: Packing, RomFS image, shader post-pass and shader rewrite tests
        working-directory: dm/tools/tests
        # test_romfs_image compiles its C with `cc`, Apple's clang where nxnative runs it; Ubuntu's cc is gcc, whose -Wmisleading-indentation (an error under the
        # test's -Werror) rejects the one-line C the test writes, so cc is clang here as well. test_spv_bind, test_spv_limits, test_spv_narrow, test_spv_pool, test_spv_wide and test_spv_xor build
        # dm/android/spv_bind.h, spv_limits.h, spv_narrow.h, spv_pool.h, spv_wide.h and spv_xor.h with clang (test_wb_alias wb_alias.h) and check their results with the NDK's spirv-val; test_gmem_table builds
        # dm/android/gmem_table.h, the raw pool table, and checks its lookups; test_ds_texels builds dm/android/ds_texels.h, the depth / stencil readback's NVN layouts (#156); test_pk_guard builds dm/android/pk_guard.h, the start-up list's marker and skip list;
        # test_img_evict builds dm/android/img_evict.h, the image eviction rules (gfx_vk_evict.inc);
        # test_img_spare builds dm/android/img_spare.h, which spare image memory a new image takes (gfx_vk_spare.inc);
        # test_wb_promote builds dm/android/wb_promote.h, when a read of a draw's pending storage buffer write takes its copy on the GPU after a barrier;
        # test_pool_fileback builds dm/android/pool_fileback.h, which memory pools are backed by a file and how placed ranges leave it (gfx_vk_fileback.inc);
        # test_spv_tgspill builds dm/android/spv_tgspill.h, compute shared memory past the GPU's limit moved into a storage buffer;
        # test_spv_harr builds dm/android/spv_harr.h, descriptor arrays longer than the replay writes shortened to what it writes;
        # test_spv_noptr test_spv_gmcache builds dm/android/spv_noptr.h, raw global memory's physical pointers rewritten into accesses to a descriptor array, and validates each result with the NDK's shader-tools;
        # test_spv_mesh and test_spv_meshemu (task / mesh shaders in compute form) assemble and validate with the NDK's shader-tools
        # test_spv_tffrag builds dm/android/spv_tffrag.h, transform feedback captured in the fragment stage (the vertex shader's wrapper and the fragment shader made from the layout);
        # test_rd_home builds dm/android/rd_home.h, the home ranges of storage buffers that draws under rasterizer discard write (gfx_vk_draw.inc rd_bind_w);
        # test_tex_aspect builds dm/android/tex_aspect.h, which aspect of a depth-stencil image a texture slot reads (stencil mode reads the stencil);
        # test_tbuf_rows builds dm/android/tbuf_rows.h, a buffer texture read through a 2D slot as rows of 16384 texels (the translator's slot numbers, the rows' shape and fill);
        # test_stream_clip builds dm/android/stream_clip.h, where an indexed draw's vertex stream is looked up to among forwardable write-backs;
        # test_android_saves runs the launcher's save import and export (dm/android/java Saves.java) on the runner's JDK over the SDK's android.jar;
        # test_android_remove runs the launcher's Remove game (Removal.java) the same way: what goes, what stays (saves, other games), links, a removal cut short;
        # test_spv_parallel runs the shader post-pass (spv_android.py) in several processes and checks its files and lines against one process's;
        # test_spv_int_inputs runs the translation's second pass for vertex shaders (spv_build.py int_input_jobs) in several processes and checks it against one process;
        # test_spv_build runs spv_build.py with a stand-in translator: its temporary folder is under WORK and removed however the run ends;
        # test_split_targeted runs the shader split of only the files a registered profile's shader map names, and its fallback to every file;
        # test_uepak_aes decrypts published AES-256 vectors through OpenSSL's libcrypto, which opens an Unreal pak's encrypted index on Linux;
        # test_build_stamp checks the commit and version the host logs on its build: line (dm/android/tools/build_stamp.py), from a checkout and a release's archive
        # test_crash_text builds dm/host/crash_text.h, the text a register points at in a crash dump, and reads it through process_vm_readv as the Android host does
        # test_gpu_floor builds dm/android/gpu_floor.h, which KGSL contexts get the GPU clock floor (DM_VK_GPU_FLOOR) and at which level, against a stand-in for the kernel driver
        # test_avc_sps builds dm/android/avc_sps.h, whether an H.264 movie's pictures leave the decoder in decode order (media_android.c then waits for each one)
        # test_rb16 builds dm/android/rb16.h with the real format table (dm/gfx/tex/nvn_fmt_mtl.c), NVN's RGB-order 16-bit formats exchanged into Vulkan's order and back (#417)
        # test_au_pace builds dm/android/au_pace.h, the AAudio output's 5 ms pacer and its ring, against a simulated phone of 20 ms data callbacks and a game that keeps three 240-frame buffers (#485)
        # test_android_linux runs DroidPlay for Linux's first-start unpack (dm/android/linux/unpack.py), Stop ending a build's process group, and the XDG data folder
        run: |
          mkdir -p "$RUNNER_TEMP/cc" && ln -sf "$(command -v clang)" "$RUNNER_TEMP/cc/cc"
          PATH="$RUNNER_TEMP/cc:$PATH" python -m unittest -v test_android_cli test_android_saves test_android_remove test_android_shaders test_android_oodle test_android_desktop test_android_linux test_device_lock test_romfs_image test_spv_harr test_spv_alpha test_spv_bind test_spv_cbsize test_spv_parallel test_spv_int_inputs test_spv_build test_split_targeted test_uepak_aes test_spv_layer test_spv_vsinit test_spv_precise test_spv_limits test_spv_narrow test_spv_pool test_spv_wide test_spv_xor test_spv_tgspill test_spv_noptr test_spv_mesh test_spv_meshemu test_spv_tffrag test_wb_alias test_gmem_table test_ds_texels test_prev_file test_pk_guard test_img_evict test_sb_reuse test_img_spare test_pool_fileback test_rec_desc test_rd_home test_tex_aspect test_tbuf_rows test_stream_clip test_wb_promote test_crash_text test_avc_sps test_build_stamp test_gpu_floor test_rb16 test_au_pace

  # The same host build and packing tests on Windows, set up as a player's PC is (docs/android.md, What the command line needs): Python 3.14, since lz4 has no Windows wheel for 3.15 and a
  # player's PC has no compiler to build it, with UTF-8 mode on, since nxnative's scripts read and write text without naming UTF-8, which Python on Windows otherwise
  # takes as the system's code page. test_romfs_image stays on Linux: it compiles C with cc and runs xattr and bash, which packing on Windows does not use. The runner
  # is an administrator, so it makes symbolic links that a player's Windows refuses (test_android_cli's Windows tests cover those).
  windows:
    name: Android host build and packing tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Python modules the packing script imports
        run: python -m pip install lz4 capstone fonttools zbic
      - name: NDK and CMake
        run: |
          $sdk = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          1..50 | ForEach-Object { 'y' } | & $sdk --licenses | Out-Null
          & $sdk --install "ndk;$env:NDK_VERSION" "cmake;$env:CMAKE_VERSION" | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build the Android host (the game library, the command-line host, the loader and libadrenotools with its hooks)
        run: |
          $sdk = $env:ANDROID_HOME -replace '\\', '/'   # CMake takes forward slashes
          $cm = "$sdk/cmake/$env:CMAKE_VERSION/bin"
          $py = (Get-Command python).Source -replace '\\', '/'
          & "$cm/cmake.exe" -G Ninja -S dm/android -B build "-DCMAKE_MAKE_PROGRAM=$cm/ninja.exe" `
            "-DCMAKE_TOOLCHAIN_FILE=$sdk/ndk/$env:NDK_VERSION/build/cmake/android.toolchain.cmake" `
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 "-DGAME=$env:GAME" "-DPython3_EXECUTABLE=$py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$cm/ninja.exe" -C build dmhost_app dmhost_cli nxloader adrenotools hook_impl main_hook
      - name: Packing tests
        working-directory: dm/tools/tests
        # test_spv_parallel: the shader post-pass's process pool, which on Windows can only spawn (modules assembled with the NDK's spirv-as);
        # test_spv_int_inputs: the translation's process pool, likewise;
        # test_spv_build: spv_build.py's temporary folder, under WORK and removed however the run ends;
        # test_split_targeted: the shader split of a registered profile's named files, whose paths a Windows split lists with '/' as well;
        # test_uepak_aes: published AES-256 vectors through CNG (bcrypt.dll), which opens an Unreal pak's encrypted index on Windows (droidplay-core#359);
        # test_build_stamp: the commit and version a player's host logs, from the staged tree's VERSION and the commit git archive filled in
        run: python -m unittest -v test_android_cli test_android_saves test_android_shaders test_android_oodle test_android_desktop test_device_lock test_spv_parallel test_spv_int_inputs test_spv_build test_split_targeted test_uepak_aes test_build_stamp
