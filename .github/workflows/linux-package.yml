# DroidPlay for Linux as an AppImage (dm/android/linux/stage.sh): Python from python-build-standalone with the modules scripts/nxnative_android.py.lock pins,
# PySide6 cut to what the app uses, and the tree as a release ships it, packed by appimagetool with AppImage's static runtime. stage.sh checks what it staged
# (--check's Python rows, the fonts, every ELF file's glibc needs, the window offscreen). Then the AppImage is started as players start it: here on Ubuntu
# 24.04 with FUSE, and in containers of five distributions without it (dm/android/linux/smoke_test.sh), under X11, Wayland and offscreen. The AppImage and its
# .sha256 are kept as this run's artifact for a few days, for testers. Pull requests that touch what goes in run this.
name: linux-package

on:
  push:
    branches: [linux/appimage-p2, linux/appimage-p3]   # Phases 2 and 3's work branches, for their CI runs before a pull request: come out before merging
  pull_request:
    paths:
      - dm/android/linux/**
      - dm/android/licenses/**
      - dm/android/desktop/**
      - dm/android/tools/data_home.py
      - scripts/nxnative_android.py
      - scripts/nxnative_android.py.lock
      - scripts/build_android_from_nsp.py
      - .github/workflows/linux-package.yml
  workflow_dispatch:
    inputs:
      version:
        description: The version the AppImage's VERSION file says (default git describe). An X.Y.Z build takes updates, from a stand-in release too (DM_UPDATE_FEED)
        type: string
        default: ''
  workflow_call:
    inputs:
      version:
        description: The version the AppImage's VERSION file says (default git describe)
        type: string
        default: ''
      ref:
        description: What to check out (a release's tag; default the event's commit)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: DroidPlay for Linux staged, packed into an AppImage and started with FUSE
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0   # git describe names the version from the newest tag
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      # The libraries DroidPlay takes from the system (a desktop has them; the runner's image doesn't have them all): stage.sh draws the icon and opens the
      # window with the staged Qt
      - name: The desktop libraries Qt needs
        run: sudo apt-get install -y -qq libegl1 libgl1 libfontconfig1 libfreetype6 libglib2.0-0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 > /dev/null
      - name: Stage DroidPlay, check it and pack the AppImage
        env:
          VERSION: ${{ inputs.version }}   # through the environment, not pasted into the script
        run: dm/android/linux/stage.sh --out "$RUNNER_TEMP/linux" --version "$VERSION"
      # As on a desktop: the kernel's FUSE and fusermount3, and no libfuse2, which Ubuntu 22.04 and later don't install. The type-2 runtime needs no more
      - name: The AppImage started with FUSE (Ubuntu 24.04, no libfuse2)
        run: |
          sudo apt-get install -y -qq fuse3 > /dev/null
          ! ldconfig -p | grep -q 'libfuse\.so\.2' || echo 'libfuse2 is installed on this runner: the check below would not tell'
          img=$(ls "$RUNNER_TEMP"/linux/DroidPlay-*-x86_64.AppImage); home=$(mktemp -d)
          HOME=$home QT_QPA_PLATFORM=offscreen setsid "$img" > "$RUNNER_TEMP/fuse.log" 2>&1 & pid=$!
          sleep 20
          grep -q ' fuse\.DroidPlay' /proc/mounts || { cat "$RUNNER_TEMP/fuse.log"; echo 'the AppImage is not mounted with FUSE'; exit 1; }
          kill -0 $pid || { cat "$RUNNER_TEMP/fuse.log"; echo 'DroidPlay closed by itself'; exit 1; }
          test -f "$home"/.local/share/DroidPlay/*/.complete
          grep ' fuse\.DroidPlay' /proc/mounts; cat "$RUNNER_TEMP/fuse.log"
          kill -- -$pid
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DroidPlay-AppImage
          path: |
            ${{ runner.temp }}/linux/DroidPlay-*-x86_64.AppImage
            ${{ runner.temp }}/linux/DroidPlay-*-x86_64.AppImage.sha256
          retention-days: 7
          compression-level: 0   # squashfs with zstd already

  smoke:
    name: Started on ${{ matrix.name }} (X11, Wayland, offscreen)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:   # near the glibc floor (22.04: 2.35), conservative, and the rolling releases
          - { name: Ubuntu 22.04, image: 'ubuntu:22.04' }
          - { name: Debian 12, image: 'debian:12' }
          - { name: Fedora, image: 'fedora:latest' }
          - { name: Arch Linux, image: 'archlinux:latest' }
          - { name: openSUSE Tumbleweed, image: 'opensuse/tumbleweed:latest' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DroidPlay-AppImage
          path: appimage
      - name: The AppImage in a ${{ matrix.name }} container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          img=$(cd appimage && ls DroidPlay-*-x86_64.AppImage)
          docker run --rm -v "$PWD:/w" -w /w "$IMAGE" bash dm/android/linux/smoke_test.sh "/w/appimage/$img" /w/smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ strategy.job-index }}
          path: smoke
          retention-days: 7
